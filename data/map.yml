# 임베디드 로드맵 지도 (홈 · /map/)
# 원본: Embedded Systems Engineering Roadmap — Meysam Parvizi (CC BY-SA 4.0)
#       https://github.com/m3y54m/Embedded-Engineering-Roadmap
# 이 파일은 원본을 한국어로 옮기고 "지금 업무"·"이 프로젝트" 표시를 더한 2차 저작물이며 같은 CC BY-SA 4.0을 따른다.
#
# 항목 형식: [영문, 한글, 우선순위(req 필수 | rec 권장 | opt 선택), 표시]
#   표시: now = 지금 업무에서 쓰는 것
#         proj = 이 사이트 프로젝트에서 다루는 것 → links 에 회차·예제·개발 환경 연결
# links 형식: ep:<프로젝트>:<회차> | ex:<예제 id> | setup:<slug>
#
# ── 영상 찍고 칸에 표시하는 더 쉬운 방법 ──────────────────────────────
# 여기를 고치지 않고, 그 회차 파일 머리말에 적어도 돼요. 둘 다 같이 써도 됩니다.
#
#   data/field-ota-pipeline/episodes/ep07.md
#   ---
#   title: 부트로더 올리기
#   status: 공개
#   map: [mcu.bootloader, fund.memory-management]   # ← 이 회차가 채우는 칸
#   ---
#
# 칸 주소는 "<그룹 id>.<영문 이름을 소문자-하이픈으로>" 예: lang.c · fund.memory-management.
#   (C++ → cpp, C# → csharp, "JTAG / SWD" → jtag-swd)
# 겹치지만 않으면 그룹을 빼고 뒷부분만 (memory-management) 적어도 되고, 한글 이름으로도 찾아요.
# 주소를 외울 필요는 없어요 — /map/ 에서 칸을 누르면 그 칸의 주소가 아래에 나옵니다.
# 특정 칸에 짧은 주소를 주고 싶으면 그 항목에 id: 를 직접 적으면 돼요.
# 못 찾거나 여러 칸에 맞으면 mkdocs build 할 때 경고가 떠요 (조용히 넘어가지 않아요).
#
# 배치는 원본 그림과 같다 (overrides/partials/map.html 이 그룹 id로 자리를 정함). 여기서는 항목 내용만 고친다.

source:
  title: Embedded Systems Engineering Roadmap
  author: Meysam Parvizi
  url: https://github.com/m3y54m/Embedded-Engineering-Roadmap
  license: CC BY-SA 4.0
  license_url: https://creativecommons.org/licenses/by-sa/4.0/

# 프로젝트 고르는 기준 (지도 아래 · /map/ 에 보임)
selection:
  - { k: 필수부터, v: 노란 칸(필수) 중 아직 안 다룬 것을 먼저 채운다. }
  - { k: 권장은 업무와 잇기, v: 살구 칸(권장)은 지금 업무와 맞닿은 것부터 고른다. }
  - { k: 선택은 깊게, v: 회색 칸(선택)은 보안 · 검증처럼 정한 전문 분야만 골라 깊게 판다. }
  - { k: 세 영역을 걸치게, v: 프로젝트 하나가 소프트웨어 · 경계 · 하드웨어를 모두 건드리게 짠다. }

