{% extends "main.html" %}
{% import "partials/hb.html" as ui with context %}
{% block content %}
<div class="hb">
  {{ ui.crumbs([["홈", ""], ["프로젝트", none]]) }}
  <h1 class="hb-h1 hb-h1--page">프로젝트</h1>
  

  <div class="hb-filter" role="group" aria-label="종류로 거르기" data-filter="kind" data-target="#hb-plist">
    <button type="button" aria-pressed="true" data-v="all">모든 종류</button>
    <button type="button" aria-pressed="false" data-v="main">메인 <span class="hb-mono">{{ hb.kind_counts.main }}</span></button>
    <button type="button" aria-pressed="false" data-v="side">사이드 <span class="hb-mono">{{ hb.kind_counts.side }}</span></button>
  </div>
  <div class="hb-filter" role="group" aria-label="상태로 거르기" data-filter="status" data-target="#hb-plist">
    <button type="button" aria-pressed="true" data-v="all">전체 <span class="hb-mono">{{ hb.projects | length }}</span></button>
    <button type="button" aria-pressed="false" data-v="wip">진행 중 <span class="hb-mono">{{ hb.counts.wip }}</span></button>
    <button type="button" aria-pressed="false" data-v="todo">준비 중 <span class="hb-mono">{{ hb.counts.todo }}</span></button>
    <button type="button" aria-pressed="false" data-v="done">완료 <span class="hb-mono">{{ hb.counts.done }}</span></button>
  </div>

  <div id="hb-plist" class="hb-gallery">
    {% for p in hb.projects %}{{ ui.thumb(p) }}{% endfor %}
  </div>
  <div class="hb-empty" hidden>아직 이 상태의 프로젝트가 없어요.</div>

  {{ ui.footer_links() }}
</div>
{% endblock %}
