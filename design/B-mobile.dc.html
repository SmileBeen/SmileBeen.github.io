<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>흰 책상 노트 — 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px">
<dc-import name="Desk" dark="{{ dark }}" hint-size="390px,3500px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":3500}}'>
class Component extends DCLogic {
renderVals() {
return { dark: this.props.dark ?? true };
}
}
</script>
</body>
</html>
