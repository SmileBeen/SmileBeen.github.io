<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>갤러리 구조 — 모바일</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px">
<dc-import name="Gallery" dark="{{ dark }}" hint-size="390px,3000px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":3000}}'>
class Component extends DCLogic {
renderVals() {
return { dark: this.props.dark ?? false };
}
}
</script>
</body>
</html>
