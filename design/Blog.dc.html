<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>블로그 전체</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
button{font:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 16px; line-height: 1.6">

<header style="border-bottom: 1px solid {{t.line}}">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px">
<a href="Gallery.dc.html" style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.copper}}" stroke-width="1.8" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg><span>펌웨어 작업실</span></a>
<nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px; font-size: 15px; font-weight: 500; color: {{t.muted}}">
<a href="Projects.dc.html" style="padding: 10px 12px">프로젝트</a>
<a href="Tags.dc.html" style="padding: 10px 12px">다루는 것</a>
<a href="Parts.dc.html" style="padding: 10px 12px">부품</a>
<a href="Blog.dc.html" aria-current="page" style="padding: 10px 12px; color: {{t.text}}; font-weight: 700">블로그</a>
<a href="About.dc.html" style="padding: 10px 12px">소개</a>
</nav>
</div>
</header>

<main style="max-width: 860px; margin: 0 auto; padding: 56px 24px 72px">
<p style="margin: 0 0 8px; font-size: 14px; color: {{t.muted}}"><a href="Gallery.dc.html">홈</a> / 블로그</p>
<h1 style="margin: 0 0 6px; font-size: 40px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em">블로그</h1>
<p style="margin: 0 0 28px; font-size: 17px; color: {{t.muted}}">작업실 세팅, 프로젝트 뒷이야기, 영상에 다 못 담은 내용을 적어요.</p>

<div role="group" aria-label="분류로 거르기" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.label}} <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; opacity: 0.8">{{f.count}}</span></button>
</sc-for>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 48px 24px; border-radius: 14px; border: 1.5px dashed {{t.line}}; text-align: center; color: {{t.muted}}">아직 이 분류의 글이 없어요.</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{shown}}" as="p" hint-placeholder-count="2">
<a href="{{p.href}}" style="display: flex; flex-direction: column; gap: 6px; padding: 22px 24px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}; text-decoration: none; opacity: {{p.op}}">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px">
<span style="font-family: 'JetBrains Mono', monospace; color: {{t.muted}}">{{p.date}}</span>
<span style="font-weight: 700; padding: 2px 10px; border-radius: 999px; background: {{t.chipBg}}; color: {{t.chipFg}}">{{p.cat}}</span>
</span>
<b style="font-size: 20px; line-height: 1.4">{{p.title}}</b>
<span style="font-size: 15px; color: {{t.muted}}">{{p.excerpt}}</span>
</a>
</sc-for>
</div>
</main>

<footer style="border-top: 1px solid {{t.line}}">
<div style="max-width: 1120px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 4px; font-size: 13px; color: {{t.muted}}">
<a href="https://github.com/USERNAME" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"></path></svg>GitHub</a>
<a href="https://www.youtube.com/" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>유튜브</a>
<a href="mailto:" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>이메일</a>
</div>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":1400}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: 'all' }; }
renderVals() {
const dark = this.props.dark ?? true;
const t = dark ? {
bg: '#0E182B', surface: '#15223A', line: '#283A5A', text: '#ECEFF5', muted: '#A4B1C7', copper: '#D08A52', chipBg: '#1D2E4D', chipFg: '#C9D4E6', onBg: '#D08A52', onFg: '#1C1107'
} : {
bg: '#F4F5F7', surface: '#FFFFFF', line: '#DCE0E7', text: '#13213D', muted: '#535E76', copper: '#C8834D', chipBg: '#E7EBF2', chipFg: '#2A3858', onBg: '#C8834D', onFg: '#1C1107'
};
const posts = [
{ cat: '작업실', date: '2026.10.29', title: '작업실을 꾸렸어요', excerpt: '2.4m 방에 흰 책상 하나를 벽에 붙이고, 가운데를 시험대 자리로 비웠어요.', href: 'Post.dc.html', op: '1' },
{ cat: '작업실', date: '예정', title: '[다음 글] 조명 · 매트 · 오버헤드 카메라 세팅', excerpt: '지난 글에서 예고한 촬영 세팅 정리', href: 'Blog.dc.html', op: '0.6' }
];
const defs = ['전체', '작업실', '프로젝트 기록'];
const sel = this.state.sel;
const filters = defs.map((label) => {
const key = label === '전체' ? 'all' : label;
const on = sel === key;
return {
label, on,
count: key === 'all' ? posts.length : posts.filter(p => p.cat === key).length,
pick: () => this.setState({ sel: key }),
style: 'cursor: pointer; min-height: 40px; padding: 0 16px; border-radius: 999px; font-size: 14px; font-weight: 700; border: 1px solid ' + (on ? t.onBg : t.line) + '; background: ' + (on ? t.onBg : t.surface) + '; color: ' + (on ? t.onFg : t.text)
};
});
const shown = posts.filter(p => sel === 'all' || p.cat === sel);
return { t, filters, shown, empty: shown.length === 0 };
}
}
</script>
</body>
</html>
