<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>소개</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</helmet>
<div style="min-height: 100vh; background: {{t.bg}}; color: {{t.text}}; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 16px; line-height: 1.7">

<header style="border-bottom: 1px solid {{t.line}}">
<div style="max-width: 1120px; margin: 0 auto; padding: 0 24px; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px">
<a href="Gallery.dc.html" style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.copper}}" stroke-width="1.8" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1.5"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg><span>펌웨어 작업실</span></a>
<nav aria-label="주 메뉴" style="display: flex; flex-wrap: wrap; gap: 2px; font-size: 15px; font-weight: 500; color: {{t.muted}}">
<a href="Projects.dc.html" style="padding: 10px 12px">프로젝트</a>
<a href="Tags.dc.html" style="padding: 10px 12px">다루는 것</a>
<a href="Parts.dc.html" style="padding: 10px 12px">부품</a>
<a href="Blog.dc.html" style="padding: 10px 12px">블로그</a>
<a href="About.dc.html" aria-current="page" style="padding: 10px 12px; color: {{t.text}}; font-weight: 700">소개</a>
</nav>
</div>
</header>

<main style="max-width: 860px; margin: 0 auto; padding: 56px 24px 72px">
<p style="margin: 0 0 8px; font-size: 14px; color: {{t.muted}}"><a href="Gallery.dc.html">홈</a> / 소개</p>
<h1 style="margin: 0 0 16px; font-size: 40px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em">소개</h1>
<p style="margin: 0 0 40px; font-size: 18px; color: {{t.muted}}">임베디드 펌웨어 개발자예요. 현장에 설치되는 통신 장비의 펌웨어, 모뎀 연동, 데이터 전송, 현장 시운전과 통신 시험을 해왔어요.</p>

<section aria-labelledby="h-focus" style="margin-bottom: 40px">
<h2 id="h-focus" style="margin: 0 0 16px; font-size: 22px; font-weight: 800">지금 집중하는 것</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px">
<sc-for list="{{focus}}" as="f" hint-placeholder-count="3">
<a href="Tags.dc.html" style="display: flex; flex-direction: column; gap: 6px; padding: 20px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.line}}">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: {{t.copperText}}">{{f.k}}</span>
<b style="font-size: 16px; line-height: 1.5">{{f.v}}</b>
</a>
</sc-for>
</div>
</section>

<section aria-labelledby="h-site" style="padding: 22px 24px; border-radius: 14px; background: {{t.surface}}; border: 1px solid {{t.edge}}">
<h2 id="h-site" style="margin: 0 0 8px; font-size: 18px; font-weight: 800">이 사이트 보는 법</h2>
<p style="margin: 0; color: {{t.muted}}">프로젝트 하나에 영상이 여러 편 이어져요. <a href="Projects.dc.html" style="color: {{t.copperText}}; font-weight: 700">프로젝트</a>에서 하나를 골라 1화부터 따라 하거나, <a href="Tags.dc.html" style="color: {{t.copperText}}; font-weight: 700">다루는 것</a>에서 궁금한 기술만 골라 보세요.</p>
</section>
</main>

<footer style="border-top: 1px solid {{t.line}}">
<div style="max-width: 1120px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0 4px; font-size: 13px; color: {{t.muted}}">
<a href="https://github.com/USERNAME" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"></path></svg>GitHub</a>
<a href="https://www.youtube.com/" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 4l13 8-13 8z"></path></svg>유튜브</a>
<a href="mailto:" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>이메일</a>
</div>
</footer>
</div>
</x-dc>

const dark = this.props.dark ?? true;
const t = dark ? {
bg: '#0E182B', surface: '#15223A', line: '#283A5A', edge: 'rgba(208,138,82,0.45)', text: '#ECEFF5', muted: '#A4B1C7', copper: '#D08A52', copperText: '#E5A36E'
} : {
bg: '#F4F5F7', surface: '#FFFFFF', line: '#DCE0E7', edge: 'rgba(181,103,47,0.45)', text: '#13213D', muted: '#535E76', copper: '#C8834D', copperText: '#93501E'
};
return {
t,
focus: [
{ k: '부트로더 · OTA', v: '부트로더와 서명된 원격 업데이트 (A/B 슬롯, 롤백 방지)' },
{ k: '디바이스 보안', v: '위협 분석(TARA), 기기 인증서, TLS' },
{ k: 'HIL', v: 'HIL 시험대로 하는 자동 시험' }
]
};
}
}
</script>
</body>
</html>
